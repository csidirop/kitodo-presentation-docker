services:
  keycloak:
    image: keycloak/keycloak:26.8.1
    container_name: kitodo-presentation-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${OIDC_BROWSER_BASE_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      OIDC_REALM: ${OIDC_REALM:-kitodo}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-kitodo-presentation}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-kitodo-presentation-secret-change-me}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-image-reader}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost/}
      OIDC_WEB_ORIGIN: ${OIDC_WEB_ORIGIN:-http://localhost}
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    ports:
      - "0.0.0.0:${KEYCLOAK_PORT:-8081}:8080"
    restart: unless-stopped
  db:
    container_name: kitodo-presentation-db
    image: mariadb:10
    environment:
      - MARIADB_DATABASE=typo3-presentation
      - MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD
      - MARIADB_USER=$MARIADB_USER
      - MARIADB_PASSWORD=$MARIADB_PASSWORD
    #volumes:
    #  - ./volumes/database:/var/lib/mysql
    restart: unless-stopped
  main:
    build:
      context: .
      args:
        - PHP_MEMORY_LIMIT=$PHP_MEMORY_LIMIT
      pull: true
    image: kitodo/presentation
    container_name: kitodo-presentation-main
    hostname: $PQDN
    ports:
      - "0.0.0.0:$PORT:80"
    environment:
      - DB_ADDR=db
      - DB_PORT=3306
      - DB_NAME=typo3-presentation
      - DB_USER=$MARIADB_USER
      - DB_PASSWORD=$MARIADB_PASSWORD
      - TYPO3_ADMIN_USER=$TYPO3_ADMIN_USER
      - TYPO3_ADMIN_PASSWORD=$TYPO3_ADMIN_PASSWORD
      - TYPO3_ADDITIONAL_CONFIGURATION=$TYPO3_ADDITIONAL_CONFIGURATION
      - HOST=$PQDN
      - PORT=$PORT
      - OIDC_REALM=${OIDC_REALM:-kitodo}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-kitodo-presentation}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-kitodo-presentation-secret-change-me}
      - OIDC_REQUIRED_ROLE=${OIDC_REQUIRED_ROLE:-image-reader}
      - OIDC_BROWSER_BASE_URL=${OIDC_BROWSER_BASE_URL:-http://localhost:8081}
      - OIDC_INTERNAL_BASE_URL=${OIDC_INTERNAL_BASE_URL:-http://keycloak:8080}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost/}
    volumes:
      - ./volumes/fileadmin:/var/www/typo3/public/fileadmin/
      - ./packages:/var/www/typo3/packages
    depends_on:
      - db
      - keycloak
    restart: unless-stopped
  solr:
    container_name: kitodo-presentation-solr
    image: solr:8
    environment:
      # All vars: /etc/default/solr.in.sh
      - SOLR_OPTS=-XX:-UseLargePages #Fixes JVM out of memory error
    command: solr-precreate dlf /var/solr/data/configsets/dlf
    volumes:
      - ./volumes/solr/solrconfig/dlf:/var/solr/data/configsets/dlf
      - ./volumes/solr/plugin:/opt/solr/contrib/ocrsearch/lib/
      # - ./volumes/solr/solrdata:/var/solr
    ports:
      - "0.0.0.0:8983:8983"
    restart: unless-stopped
    profiles:
      - with-solr
  phpmyadmin:
    container_name: kitodo-presentation-phpmyadmin
    image: phpmyadmin:latest
    environment:
      - PMA_HOST=db
      - PMA_USER=$MARIADB_USER
      - PMA_PASSWORD=$MARIADB_PASSWORD
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - with-phpmyadmin
